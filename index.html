<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Biblioteca v1.9.0</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f8f9fa; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .version-tag { font-size: 11px; color: #aaa; margin-bottom: 20px; }
        
        .campo-isbn { width: 100%; max-width: 280px; padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #ced4da; margin-bottom: 10px; text-align: center; box-sizing: border-box; }
        .campo-isbn:focus { border-color: #007bff; outline: none; }
        
        button { background: #007bff; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 280px; margin: 10px auto; display: block; }
        button:active { background: #0056b3; }
        
        #info-estado { color: #555; font-size: 14px; margin: 15px 0; font-weight: 500; font-style: italic; }
        #caja-volcado { background: #212529; color: #00ff00; font-family: monospace; text-align: left; padding: 15px; border-radius: 8px; font-size: 11px; overflow-x: auto; max-height: 300px; margin-top: 20px; display: none; white-space: pre-wrap; word-break: break-all; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mi Biblioteca (Directa)</h1>
        <div class="version-tag">Versión de la App: v1.9.0</div>
        
        <!-- Campo con el número que usaste antes -->
        <input type="number" id="isbn-manual" class="campo-isbn" placeholder="Escribe los 13 dígitos del ISBN" inputmode="numeric" value="9788410425750">
        
        <button id="btn-buscar" onclick="buscarDirectoGoogle()">Consultar Google Books</button>
        
        <div id="info-estado">Estado: En espera...</div>
        <div id="caja-volcado"></div>
    </div>

    <script>
        function actualizarEstado(txt) {
            document.getElementById('info-estado').innerText = "Acción: " + txt;
        }

        async function buscarDirectoGoogle() {
            const input = document.getElementById('isbn-manual');
            const isbn = input.value.trim().replace(/[^0-9X]/gi, "");
            const caja = document.getElementById('caja-volcado');
            
            if (isbn.length < 10) {
                alert("Por favor, introduce un código ISBN válido.");
                return;
            }

            caja.style.display = 'none';
            actualizarEstado("Lanzando petición directa a Google Books sin intermediarios...");

            // LLAMADA DIRECTA PURA sin proxies ni envoltorios
            const urlDirecta = "https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn +"&key=AIzaSyAI3ZbntVgR9XRAB4dQk2Qa_t8KAbHGbck";;
            
            try {
                const response = await fetch(urlDirecta);
                
                // Recogemos el texto tal cual responda internet para ver su formato crudo
                const textoCrudo = await response.text();
                
                caja.innerText = textoCrudo;
                caja.style.display = 'block';
                actualizarEstado("¡Respuesta cruda del servidor en pantalla!");
            } catch (error) {
                caja.innerText = "Error físico de red: " + error.message;
                caja.style.display = 'block';
                actualizarEstado("Fallo al conectar.");
            }
        }
    </script>
</body>
</html>
